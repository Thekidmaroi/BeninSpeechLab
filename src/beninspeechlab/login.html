<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · BeninSpeechLab</title><style>body{font-family:system-ui;background:#0b1423;color:#e9f1fa;margin:0;display:grid;place-items:center;min-height:100vh}main{width:min(400px,90%);background:#15243a;padding:30px;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;border-radius:9px}input{background:#0b1423;color:white;border:1px solid #526681}button{background:#ed735c;border:0;font-weight:700;cursor:pointer}p,a{color:#aab9cd}</style></head><body><main><h1>Administration</h1><p>Accès réservé aux personnes autorisées.</p><form id="login"><label for="password">Mot de passe administrateur</label><input id="password" type="password" required autocomplete="current-password"><button>Se connecter</button></form><p id="error" role="alert"></p><a href="/contribute">Retour à la contribution</a></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/v1/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok)throw Error(r.status===429?'Trop de tentatives, réessaie plus tard.':r.status===503?'Authentification non configurée.':'Identifiants invalides.');location.href='/admin'}catch(err){document.getElementById('error').textContent=err.message}finally{button.disabled=false}};</script></body></html>
