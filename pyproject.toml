[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "beninspeechlab"
version = "0.1.0"
description = "Consent-aware Fon speech ingestion research MVP"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.9,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
beninspeechlab = "beninspeechlab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
beninspeechlab = ["studio.html", "contribute.html", "login.html"]
